<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="screen">
                <b class="result"></b>
        </div>
        <div class="buttons">
            <p class="firstline">
                <button class="no" data-choice="7">7</button>
                <button class="no" data-choice="8">8</button>
                <button class="no" data-choice="9">9</button>
                <button class="no" data-choice="/">/</button>
            </p>
            <p class="secondline">
                <button class="no" data-choice="4">4</button>
                <button class="no" data-choice="5">5</button>
                <button class="no" data-choice="6">6</button>
                <button class="no" data-choice="*">*</button>
            </p>
            <p class="thirdline">
                <button class="no" data-choice="1">1</b>
                <button class="no" data-choice="2">2</button>
                <button class="no" data-choice="3">3</button>
                <button class="no" data-choice="-">-</button>
            </p>
            <p class="fourthline">
                <button class="no" data-choice="0">0</button>
                <button class="no" data-choice="C">C</button>
                <button class="no" data-choice="=">=</button>
                <button class="no" data-choice="+">+</button>
            </p>
        </div>
    </div>
    <script src="hello.js"></script>
</body>
</html>
